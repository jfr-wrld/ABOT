name: Android APK

# Builds a debug APK on every push to main or a claude/*, feature/* or fix/* branch, and on demand.
# Download it from the run's "Artifacts" section and install it on a phone.
on:
  push:
    branches: [main, "claude/**", "feature/**", "fix/**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Check the cloud sync settings
        if: ${{ vars.NEXT_PUBLIC_SUPABASE_URL == '' || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY == '' }}
        run: echo "::warning::NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_ANON_KEY is not set in the repository's Actions variables. This APK runs local-only (no Google sign-in)."

      - name: Check the Mission Control PIN
        if: ${{ vars.NEXT_PUBLIC_ABOT_ADMIN_PIN == '' }}
        run: echo "::warning::NEXT_PUBLIC_ABOT_ADMIN_PIN is not set in the repository's Actions variables. This APK opens /admin with the default PIN, which is public in this repository."

      - name: Export the web app and copy it into the Android project
        run: npm run build:android
        # Cloud sync: the project URL and anon key (public by design), from the repository's
        # Actions variables. Without them the APK runs local-only. See docs/cloud-sync-setup.md.
        # The Mission Control PIN only hides /admin (it ships inside the APK); Supabase's
        # app_admins decides who can change anything for everyone.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ABOT_ADMIN_PIN: ${{ vars.NEXT_PUBLIC_ABOT_ADMIN_PIN }}

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: abot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # The APK on a real Android 14 emulator: intro and permissions screens, Android's permission
  # dialogs, the Settings hand-off and the workout notification (scripts/android-smoke.mjs).
  # Skipped on main, where the same commit already passed it on its branch.
  smoke:
    needs: apk
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: abot-debug-apk
          path: apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke checks on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node scripts/android-smoke.mjs apk/app-debug.apk smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-screens
          path: smoke-out
          if-no-files-found: ignore
